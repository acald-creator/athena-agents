[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-agents"
version = "0.1.0"
description = "AI offensive agent framework for autonomous security testing"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PhoenixVLabs"}]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
include = ["orchestrator*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/integration"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
